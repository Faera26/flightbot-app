    },
    quiet: function () { var q = setting('quiet'); setPending('quiet', q ? [] : [23, 8]); haptic('select'); rerender(); },
    visa: function (d) { setPending('visa', d.v); haptic('select'); rerender(); },
    dpax: function (d) { var p = setting('pax').slice(); p[+d.k] += +d.d; if (paxOk(p)) { setPending('pax', p); haptic('select'); rerender(); } },
    dbag: function (d) { setPending('bag', d.v); rerender(); },
    dstops: function (d) { setPending('stops', +d.v); rerender(); },
    dthr: function (d) { setPending('thr', +d.v); rerender(); },
    'apt-open': function (d) { S.openAirport = S.openAirport === d.code ? null : d.code; rerender(); },
    'apt-on': function (d) {
      var a = (S.snap.a || []).filter(function (x) { return x[0] === d.code; })[0];
      setAirport(d.code, !airportOn(a)); haptic('select'); rerender();
    },
    'apt-pref': function (d) { setPref(d.code, d.kind || null); haptic('select'); rerender(); }
  };
  root.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute('data-act')];
    if (fn) fn(el.dataset, el, ev);
  });
  root.addEventListener('input', function (ev) {
    var el = ev.target, k = el.getAttribute('data-in');
    if (!k) return;
    if (k === 'dest') { S.destQuery = el.value; renderDestResults(); autocomplete(el.value); return; }
    if (k === 'city') { S.cityQuery = el.value; return; }
    if (k === 'budget' || k === 'dbudget') {
      var digits = el.value.replace(/\D/g, '').slice(0, 7), v = digits ? parseInt(digits, 10) : null;
      var pretty = digits ? String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : '';
      if (el.value !== pretty) el.value = pretty;
      if (k === 'budget') { S.form.maxp = v; S.form.dirty = true; } else setPending('maxp', v || 0);
      return;
    }
    if (k === 'dmin' || k === 'dmax') {
      var f = S.form, box = document.getElementById('days'), ins = box.querySelectorAll('input');
      var lo = +ins[0].value, hi = +ins[1].value;
      if (lo > hi) { if (k === 'dmin') { hi = lo; ins[1].value = hi; } else { lo = hi; ins[0].value = lo; } }
      f.min = lo; f.max = hi; f.dirty = true;
      document.getElementById('days-val').textContent = lo + '–' + hi;
      var fill = document.getElementById('days-fill');
      fill.style.left = 'calc(14px + (100% - 28px) * ' + ((lo - 1) / 29).toFixed(4) + ')';
      fill.style.right = 'calc(14px + (100% - 28px) * ' + (1 - (hi - 1) / 29).toFixed(4) + ')';
      return;
    }
    if (k === 'radius') {
      var r = +el.value, max = +el.max;
      document.getElementById('radius-val').textContent = r + NB + 'км';
      document.getElementById('radius-fill').style.right = 'calc(14px + (100% - 28px) * ' + (1 - (r - 50) / (max - 50)).toFixed(4) + ')';
    }
  });
  root.addEventListener('change', function (ev) {
    var el = ev.target, k = el.getAttribute('data-in');
    if (k === 'radius') { setPending('radius', +el.value); rerender(); }
    if (k === 'qfrom' || k === 'qto') {
      var q = (setting('quiet') || [23, 8]).slice();
      q[k === 'qfrom' ? 0 : 1] = +el.value;
      setPending('quiet', q[0] === q[1] ? [] : q); rerender();
    }
  });
  root.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.getAttribute && ev.target.getAttribute('data-in') === 'city') { ev.preventDefault(); if (buttons.main) buttons.main.action(); }
    if (ev.key === 'Enter' && ev.target.getAttribute && ev.target.getAttribute('data-in') === 'dest') { ev.preventDefault(); ev.target.blur(); }
  });

  // ================= запуск =================
  function fail(title, text) {
    root.innerHTML = '<div class="card empty" style="margin-top:24px"><b>' + esc(title) + '</b><span class="muted">' + esc(text) + '</span></div>';
    applyButtons(null, null, false);
  }
  function start(tg) {
    var b = bridge();
    TG = tg || b;
    NATIVE = !!tg;
    applyTheme();
    if (NATIVE) {
      try {
        TG.ready(); TG.expand();
        if (version('7.7') && TG.disableVerticalSwipes) TG.disableVerticalSwipes();
        TG.onEvent('themeChanged', function () { applyTheme(); render(); });
        TG.MainButton.onClick(onMain);
        if (TG.SecondaryButton) TG.SecondaryButton.onClick(onSecond);
        if (version('6.1')) TG.BackButton.onClick(goBack);
      } catch (e) { /* очень старый клиент */ }
    } else { try { TG.ready(); TG.expand(); } catch (e) { /* вне Telegram */ } }
    var hp = hashParams();
    var packed = hp.s || hp.d;
    if (!packed) { fail('Откройте приложение из Telegram', 'Нажмите кнопку «✈️ Открыть приложение» внизу чата с ботом.'); return; }
    unpack(packed).then(function (data) {
      if (hp.s) {
        S.snap = data; S.mode = 'full';
        S.stack = [{ name: 'main' }];
      } else {
        S.mode = 'deal'; S.snap = { a: [], t: [], d: [], df: { px: [1, 0, 0] } }; S.deal = data;
        S.stack = [{ name: 'deal', src: 'x' }];
      }
      if (data.v > 1) toast('Бот новее приложения — обновите страницу приложения на хостинге.');
      render();
    }).catch(function () {
      fail('Не получилось прочитать данные', 'Нажмите в чате /app — бот пришлёт свежую кнопку приложения.');
    });
  }
  loadTelegram().then(start);
})();
</script>
</body>
