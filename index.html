:root{--bg:#EDF1F6;--section:#FFFFFF;--text:#0F1B2D;--muted:#5E6B7C;--hint:#98A4B5;--sep:#E3E8EF;--fill:#EEF2F7;
--accent:#2C6BEA;--hot:#FF5B4D;--hot-bg:#FFE9E6;--hot-ink:#D7392B;--deal:#0B8F55;--deal-bg:#E2F5EC;--warn:#9A5200;--warn-bg:#FFF0DA;
--danger:#D92D20;--sel:#0F1B2D;--sel-text:#FFFFFF;--switch-off:#DCE3EC;--seg:#FFFFFF;--range:#DDE5F0;--road:#8FB8F2;--other:#C2CBD7;
--chip-line:#DCE3EC;--tabbar:rgba(255,255,255,.82);--shadow:0 1px 2px rgba(15,27,45,.05),0 10px 26px -12px rgba(15,27,45,.16);
--button:#0F1B2D;--button-text:#FFFFFF;--safe-bottom:env(safe-area-inset-bottom,0px);
--display:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Roboto,"Segoe UI",sans-serif}
:root.dark{--bg:#0E1A2F;--section:#172640;--text:#F1F4F9;--muted:#9DABC0;--hint:#6F7F97;--sep:#26375A;--fill:#1F3050;
--accent:#7EA8FF;--hot:#FF6B5E;--hot-bg:#3A2230;--hot-ink:#FF8D82;--deal:#45D190;--deal-bg:#16372B;--warn:#FFB55C;--warn-bg:#3A2C17;
--danger:#FF6961;--sel:#F1F4F9;--sel-text:#0E1A2F;--switch-off:#2A3C5F;--seg:#2A3C5F;--range:#22365A;--road:#3B6AA8;--other:#3A4C6C;
--chip-line:#2A3C5F;--tabbar:rgba(23,38,64,.84);--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.6);
--button:#F1F4F9;--button-text:#0E1A2F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/21px -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit;margin:0}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:640px;margin:0 auto;padding:18px 16px calc(28px + var(--safe-bottom));display:flex;flex-direction:column;gap:22px}
body.tabs #app{padding-bottom:calc(112px + var(--safe-bottom))}
body.pagebar #app{padding-bottom:calc(100px + var(--safe-bottom))}
body.pageback #app{padding-top:8px}
.h1{margin:0;font-family:var(--display);font-size:32px;line-height:38px;font-weight:800;letter-spacing:-.8px;overflow-wrap:anywhere}
.h1.sm{font-size:26px;line-height:31px;letter-spacing:-.5px}
.hero{display:flex;flex-direction:column;gap:4px;padding:0 4px}
.hero-row{display:flex;align-items:flex-start;gap:12px;padding:0 4px}
.lead{margin:0;font-size:15px;line-height:20px;color:var(--muted);font-weight:500}
.cap{margin:0 0 0 8px;font-size:14px;line-height:19px;font-weight:650;color:var(--muted)}
.cap-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 6px}
.cap-row .cap{margin:0;font-family:var(--display);font-size:20px;line-height:25px;font-weight:750;letter-spacing:-.3px;color:var(--text)}
.note{margin:0 10px;font-size:13px;line-height:18px;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:10px}
.card{background:var(--section);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.pad{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.list>*+*{background-image:linear-gradient(var(--sep),var(--sep));background-size:calc(100% - 18px) 1px;background-position:right top;background-repeat:no-repeat}
.list.icons>*+*{background-size:calc(100% - 66px) 1px}
.list.inset68>*+*{background-size:calc(100% - 70px) 1px}

    pause: function (d) { send({ op: 'track.pause', id: +d.id }); },
    resume: function (d) { send({ op: 'track.resume', id: +d.id }); },
    delete: function (d) {
      var t = trackingById(+d.id);
      confirmBox('Удалить «' + (t ? t.n : '') + '»? История цен тоже удалится.', 'Удалить').then(function (ok) { if (ok) send({ op: 'track.delete', id: +d.id }); });
    },
    return: function (d) { send({ op: 'deal.return', deal: +d.deal, w: d.w }); },
    link: function (d, el, ev) { ev.preventDefault(); openLink(d.url); },
    admin: function (d) { send({ op: d.op }); },
    fmode: function (d) { var f = S.form; if (f.mode !== d.v) { f.mode = d.v; f.code = null; f.name = null; f.cc = null; f.dirty = true; } haptic('select'); rerender(); },
    dmode: function (d) { S.form.dmode = d.v; S.form.dirty = true; haptic('select'); rerender(); },
    month: function (d) { S.form.month = d.v; S.form.dirty = true; haptic('select'); rerender(); },
    cal: function (d) { S.form.calMonth = d.m; rerender(); },
    day: function (d) {
      var f = S.form; f.dirty = true;
      if (!f.from || !f.picking) { f.from = d.d; f.to = d.d; f.picking = true; }
      else { if (d.d < f.from) { f.to = f.from; f.from = d.d; } else f.to = d.d; f.picking = false; }
      haptic('select'); rerender();
    },
    trip: function (d) { S.form.trip = d.v; S.form.dirty = true; haptic('select'); rerender(); },
    pax: function (d) {
      var f = S.form, p = f.px.slice(); p[+d.k] += +d.d;
      if (paxOk(p)) { f.px = p; f.dirty = true; haptic('select'); rerender(); }
    },
    fbag: function (d) { S.form.bag = d.v; S.form.dirty = true; rerender(); },
    fstops: function (d) { S.form.stops = +d.v; S.form.dirty = true; rerender(); },
    fthr: function (d) { S.form.thr = +d.v; S.form.dirty = true; rerender(); },
    dclear: function () { S.destQuery = ''; S.destResults = null; var i = document.getElementById('dest-q'); if (i) { i.value = ''; i.focus(); } renderDestResults(); },
    pick: function (d) {
      var it = destItems()[+d.i], f = S.form;
      if (!it || !f) return;
      if (it.type === 'country') { f.mode = 'country'; f.cc = it.code; f.name = it.name; f.code = null; }
      else { f.mode = 'city'; f.code = it.code; f.name = it.type === 'airport' ? (it.city || it.name) : it.name; f.cc = it.cc || null; }
      f.dirty = true; haptic('light'); goBack();
    },
    quiet: function () { var q = setting('quiet'); setPending('quiet', q ? [] : [23, 8]); haptic('select'); rerender(); },
    visa: function (d) { setPending('visa', d.v); haptic('select'); rerender(); },
    dpax: function (d) { var p = setting('pax').slice(); p[+d.k] += +d.d; if (paxOk(p)) { setPending('pax', p); haptic('select'); rerender(); } },
    dbag: function (d) { setPending('bag', d.v); rerender(); },
    dstops: function (d) { setPending('stops', +d.v); rerender(); },
    dthr: function (d) { setPending('thr', +d.v); rerender(); },
    'apt-open': function (d) { S.openAirport = S.openAirport === d.code ? null : d.code; rerender(); },
    'apt-on': function (d) {
      var a = (S.snap.a || []).filter(function (x) { return x[0] === d.code; })[0];
      setAirport(d.code, !airportOn(a)); haptic('select'); rerender();
    },
    'apt-pref': function (d) { setPref(d.code, d.kind || null); haptic('select'); rerender(); }
  };
  root.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute('data-act')];
    if (fn) fn(el.dataset, el, ev);
  });
  root.addEventListener('input', function (ev) {
    var el = ev.target, k = el.getAttribute('data-in');
    if (!k) return;
    if (k === 'dest') { S.destQuery = el.value; renderDestResults(); autocomplete(el.value); return; }
    if (k === 'city') { S.cityQuery = el.value; return; }
    if (k === 'budget' || k === 'dbudget') {
      var digits = el.value.replace(/\D/g, '').slice(0, 7), v = digits ? parseInt(digits, 10) : null;
      var pretty = digits ? String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : '';
      if (el.value !== pretty) el.value = pretty;
      if (k === 'budget') { S.form.maxp = v; S.form.dirty = true; } else setPending('maxp', v || 0);
      return;
    }
    if (k === 'dmin' || k === 'dmax') {
      var f = S.form, box = document.getElementById('days'), ins = box.querySelectorAll('input');
      var lo = +ins[0].value, hi = +ins[1].value;
      if (lo > hi) { if (k === 'dmin') { hi = lo; ins[1].value = hi; } else { lo = hi; ins[0].value = lo; } }
      f.min = lo; f.max = hi; f.dirty = true;
      document.getElementById('days-val').textContent = lo + '–' + hi;
      var fill = document.getElementById('days-fill');
      fill.style.left = 'calc(14px + (100% - 28px) * ' + ((lo - 1) / 29).toFixed(4) + ')';
      fill.style.right = 'calc(14px + (100% - 28px) * ' + (1 - (hi - 1) / 29).toFixed(4) + ')';
      return;
    }
    if (k === 'radius') {
      var r = +el.value, max = +el.max;
      document.getElementById('radius-val').textContent = r + NB + 'км';
      document.getElementById('radius-fill').style.right = 'calc(14px + (100% - 28px) * ' + (1 - (r - 50) / (max - 50)).toFixed(4) + ')';
    }
  });
  root.addEventListener('change', function (ev) {
    var el = ev.target, k = el.getAttribute('data-in');
    if (k === 'radius') { setPending('radius', +el.value); rerender(); }
    if (k === 'dh') { setPending('dh', el.value === '' ? null : +el.value); rerender(); }
    if (k === 'qfrom' || k === 'qto') {
      var q = (setting('quiet') || [23, 8]).slice();
      q[k === 'qfrom' ? 0 : 1] = +el.value;
      setPending('quiet', q[0] === q[1] ? [] : q); rerender();
    }
  });
  root.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.getAttribute && ev.target.getAttribute('data-in') === 'city') { ev.preventDefault(); if (buttons.main) buttons.main.action(); }
    if (ev.key === 'Enter' && ev.target.getAttribute && ev.target.getAttribute('data-in') === 'dest') { ev.preventDefault(); ev.target.blur(); }
  });

  // ================= запуск =================
  function fail(title, text) {
    root.innerHTML = '<div class="card empty" style="margin-top:24px"><b>' + esc(title) + '</b><span class="muted">' + esc(text) + '</span></div>';
    applyButtons(null, null, false);
  }
  function start(tg) {
    var b = bridge();
    TG = tg || b;
    NATIVE = !!tg;
    applyTheme();
    if (NATIVE) {
      try {
        TG.ready(); TG.expand();
        if (version('7.7') && TG.disableVerticalSwipes) TG.disableVerticalSwipes();
        TG.onEvent('themeChanged', function () { applyTheme(); render(); });
        TG.MainButton.onClick(onMain);
        if (TG.SecondaryButton) TG.SecondaryButton.onClick(onSecond);
        if (version('6.1')) TG.BackButton.onClick(goBack);
      } catch (e) { /* очень старый клиент */ }
    } else { try { TG.ready(); TG.expand(); } catch (e) { /* вне Telegram */ } }
    var hp = hashParams();
    var packed = hp.s || hp.d;
    if (!packed) { fail('Откройте приложение из Telegram', 'Нажмите кнопку «✈️ Открыть приложение» внизу чата с ботом.'); return; }
    unpack(packed).then(function (data) {
      if (hp.s) {
        S.snap = data;
        S.mode = NATIVE && TG.initDataUnsafe && TG.initDataUnsafe.query_id ? 'view' : 'full';
        S.stack = [{ name: hp.tab && TABS.indexOf(hp.tab) >= 0 ? hp.tab : 'hot' }];
      } else {
        S.mode = 'deal'; S.snap = { a: [], t: [], d: [], df: { px: [1, 0, 0] } }; S.deal = data;
        S.stack = [{ name: 'deal', src: 'x' }];
      }
      if (data.v > 1) toast('Бот новее приложения — обновите страницу приложения на хостинге.');
      render();
    }).catch(function () {
      fail('Не получилось прочитать данные', 'Нажмите в чате /app — бот пришлёт свежую кнопку приложения.');
    });
  }
  loadTelegram().then(start);
})();
</script>
</body>
</html>
